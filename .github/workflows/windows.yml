name: Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg and FFprobe
        run: choco install ffmpeg --no-progress -y
      - run: npm test
      - run: npm run test:nodes
      - run: npm run test:desktop
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Video-Generate-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
